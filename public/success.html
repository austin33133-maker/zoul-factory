<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank you — zoul-factory</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1020;
        color: #e6e9f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .box {
        background: #131a2e;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        padding: 32px;
        max-width: 520px;
        width: 100%;
        text-align: center;
      }
      h1 { margin: 0 0 12px; }
      .muted { color: #8b93a7; }
      .delivery {
        margin-top: 20px;
        padding: 16px;
        background: #0b1020;
        border-radius: 10px;
        word-break: break-word;
      }
      a {
        color: #818cf8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Thank you</h1>
      <p class="muted" id="status">Verifying your payment…</p>
      <div class="delivery" id="delivery" hidden></div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const sessionId = params.get('session_id');
      const status = document.getElementById('status');
      const delivery = document.getElementById('delivery');

      (async () => {
        if (!sessionId) {
          status.textContent = 'Missing session id.';
          return;
        }
        const res = await fetch('/api/delivery?session_id=' + encodeURIComponent(sessionId));
        const data = await res.json();
        if (!res.ok) {
          status.textContent = data.error || 'Could not verify payment.';
          return;
        }
        status.textContent = 'Payment confirmed for ' + data.product.name + '.';
        delivery.hidden = false;
        if (data.delivery.type === 'url') {
          const a = document.createElement('a');
          a.href = data.delivery.value;
          a.textContent = 'Click here to access your purchase';
          a.target = '_blank';
          a.rel = 'noopener';
          delivery.appendChild(a);
        } else {
          delivery.textContent = data.delivery.value;
        }
      })();
    </script>
  </body>
</html>
