<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zoul-factory — Storefront</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: #131a2e;
        --text: #e6e9f5;
        --muted: #8b93a7;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      header {
        padding: 56px 24px 24px;
        text-align: center;
      }
      h1 { margin: 0 0 8px; font-size: 32px; }
      header p { margin: 0; color: var(--muted); }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }
      .card {
        background: var(--card);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .card img { width: 100%; height: 180px; object-fit: cover; display: block; }
      .card-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
      .card h3 { margin: 0; font-size: 18px; }
      .card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
      .price { font-size: 22px; font-weight: 600; margin-top: 8px; }
      button {
        background: var(--accent);
        color: white;
        border: 0;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover { background: var(--accent-hover); }
      button:disabled { opacity: 0.6; cursor: wait; }
      footer { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <h1>zoul-factory</h1>
      <p>Digital goods. Instant delivery. Pay with card.</p>
    </header>
    <main id="grid"></main>
    <footer>Secure payments by Stripe</footer>
    <script>
      const fmt = (cents, currency) =>
        new Intl.NumberFormat(undefined, { style: 'currency', currency: currency.toUpperCase() }).format(cents / 100);

      async function load() {
        const res = await fetch('/api/products');
        const products = await res.json();
        const grid = document.getElementById('grid');
        for (const p of products) {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <img src="${p.image}" alt="" />
            <div class="card-body">
              <h3></h3>
              <p></p>
              <div class="price">${fmt(p.price_cents, p.currency)}</div>
              <button data-id="${p.id}">Buy now</button>
            </div>`;
          card.querySelector('h3').textContent = p.name;
          card.querySelector('p').textContent = p.description;
          card.querySelector('button').addEventListener('click', (e) => buy(e.target));
          grid.appendChild(card);
        }
      }

      async function buy(btn) {
        btn.disabled = true;
        btn.textContent = 'Redirecting…';
        try {
          const res = await fetch('/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_id: btn.dataset.id }),
          });
          const data = await res.json();
          if (data.url) {
            window.location = data.url;
          } else {
            btn.textContent = 'Error — try again';
            btn.disabled = false;
          }
        } catch {
          btn.textContent = 'Error — try again';
          btn.disabled = false;
        }
      }

      load();
    </script>
  </body>
</html>
