<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img,video{max-width:100%;height:auto}</style>
</head>
<body>
<title>枪火幸存者 ZOUL SURVIVORS</title>
<style>
/* ===== 枪火幸存者 — 移动端优先样式 ===== */
:root{
  --bg:#0a0e14;
  --panel:#131a24;
  --panel-2:#1b2431;
  --line:#26313f;
  --mint:#4ee1a0;
  --mint-d:#2fae79;
  --gold:#ffd93d;
  --red:#ff5c6c;
  --blue:#4db8ff;
  --purple:#b06cff;
  --txt:#e7eef7;
  --dim:#8494a8;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  color:var(--txt);
  overscroll-behavior:none;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
}

#app{position:fixed;inset:0;overflow:hidden;}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;}

.screen{position:absolute;inset:0;}
.hidden{display:none !important;}

/* ---------- 遮罩层通用 ---------- */
.overlay{
  display:flex;align-items:center;justify-content:center;
  background:rgba(6,9,13,.82);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:calc(16px + var(--safe-t)) 18px calc(16px + var(--safe-b));
  z-index:20;
}
.panel{
  width:100%;max-width:420px;
  background:linear-gradient(180deg,var(--panel) 0%,#0f151d 100%);
  border:1px solid var(--line);border-radius:20px;
  padding:22px 18px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.panel-tall{display:flex;flex-direction:column;}
.panel h2{margin:0 0 16px;font-size:19px;letter-spacing:2px;text-align:center;font-weight:700;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-head h2{margin:0;}

/* ---------- 按钮 ---------- */
.btn{
  display:block;width:100%;margin-top:10px;
  padding:14px 16px;border:1px solid var(--line);border-radius:14px;
  background:var(--panel-2);color:var(--txt);
  font-size:16px;font-weight:600;letter-spacing:1px;font-family:inherit;
  cursor:pointer;transition:transform .06s,filter .15s;
}
.btn:active{transform:scale(.97);filter:brightness(1.25);}
.btn-primary{
  background:linear-gradient(180deg,var(--mint) 0%,var(--mint-d) 100%);
  border-color:transparent;color:#06251a;font-weight:800;
}
.btn-danger{background:transparent;border-color:#4a2630;color:var(--red);}
.btn-big{padding:16px;font-size:17px;}
.btn-sm{padding:11px;font-size:14px;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{margin-top:10px;}
.btn:disabled{opacity:.38;pointer-events:none;}

/* 激励视频按钮 */
.btn-ad{
  background:linear-gradient(180deg,#2a3a52 0%,#1b2735 100%);
  border-color:#37506e;color:#cfe4ff;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.ad-tag{
  background:var(--gold);color:#3a2c00;
  font-size:10px;font-weight:900;letter-spacing:.5px;
  padding:2px 6px;border-radius:5px;
}
.dim{color:var(--dim);font-size:13px;font-weight:500;}

.icon-btn{
  width:38px;height:38px;flex:0 0 38px;
  border:1px solid var(--line);border-radius:11px;
  background:rgba(19,26,36,.75);color:var(--txt);
  font-size:13px;cursor:pointer;font-family:inherit;
}
.icon-btn:active{filter:brightness(1.4);}

/* ---------- 主菜单 ---------- */
.logo{text-align:center;margin:6px 0 20px;}
.logo-main{
  font-size:34px;font-weight:900;letter-spacing:6px;
  background:linear-gradient(180deg,#fff 0%,var(--mint) 120%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.logo-sub{font-size:11px;letter-spacing:6px;color:var(--dim);margin-top:6px;}
.best-row,.result-grid{display:flex;gap:8px;margin-bottom:18px;}
.stat{
  flex:1;background:rgba(0,0,0,.28);border:1px solid var(--line);
  border-radius:12px;padding:10px 4px;text-align:center;
}
.stat-v{display:block;font-size:19px;font-weight:800;color:var(--mint);font-variant-numeric:tabular-nums;}
.stat-k{display:block;font-size:11px;color:var(--dim);margin-top:3px;}
.hint{text-align:center;color:var(--dim);font-size:12px;margin:16px 0 2px;line-height:1.6;}

/* ---------- HUD ---------- */
#hud{pointer-events:none;z-index:10;}
.hud-top{
  position:absolute;top:0;left:0;right:0;
  padding:calc(8px + var(--safe-t)) 12px 0;
}
.hud-row{display:flex;align-items:center;gap:10px;}
.hud-meta{margin-top:7px;gap:6px;}
.hp-wrap{flex:1;position:relative;}
.hp-bar{
  height:20px;background:rgba(0,0,0,.55);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.hp-fill{
  height:100%;width:100%;
  background:linear-gradient(90deg,#ff4757,#ff7f8c);
  transition:width .12s linear;
}
.hp-text{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums;
}
.xp-bar{
  height:6px;margin-top:6px;background:rgba(0,0,0,.55);
  border-radius:3px;overflow:hidden;
}
.xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),#8affd0);transition:width .1s linear;}
.chip{
  background:rgba(10,14,20,.72);border:1px solid var(--line);
  border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.chip.time{color:var(--gold);}
#btnPause{pointer-events:auto;}

.weapon-bar{
  position:absolute;left:12px;top:calc(96px + var(--safe-t));
  display:flex;flex-direction:column;gap:5px;
}
.wchip{
  display:flex;align-items:center;gap:5px;
  background:rgba(10,14,20,.66);border:1px solid var(--line);
  border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;
}
.wchip .wlv{color:var(--gold);}

/* 局内飘字提示 */
.toast-layer{
  position:absolute;left:0;right:0;top:38%;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.toast{
  background:rgba(10,14,20,.85);border:1px solid var(--mint);
  color:var(--mint);border-radius:10px;padding:7px 16px;
  font-size:13px;font-weight:700;letter-spacing:1px;
  animation:toastIn .25s ease-out, toastOut .3s ease-in 1.1s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.9);}to{opacity:1;transform:none;}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px);}}

/* ---------- 升级卡 ---------- */
.lv-title{color:var(--gold);}
.lv-num{color:var(--dim);font-size:14px;font-weight:500;margin-left:6px;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{
  display:flex;align-items:center;gap:12px;
  background:var(--panel-2);border:1px solid var(--line);
  border-left:4px solid var(--mint);
  border-radius:14px;padding:13px 14px;
  cursor:pointer;transition:transform .06s,filter .12s;
  text-align:left;width:100%;font-family:inherit;color:var(--txt);
}
.card:active{transform:scale(.975);filter:brightness(1.3);}
.card.new{border-left-color:var(--gold);}
.card.weapon{border-left-color:var(--purple);}
.card-icon{
  flex:0 0 42px;height:42px;border-radius:11px;
  background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.card-body{flex:1;min-width:0;}
.card-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;}
.card-lv{font-size:11px;color:var(--gold);font-weight:700;}
.card-tag{
  font-size:9px;background:var(--gold);color:#3a2c00;
  padding:1px 5px;border-radius:4px;font-weight:900;
}
.card-desc{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.45;}

/* ---------- 商店 ---------- */
.gold-pill{
  background:rgba(255,217,61,.12);border:1px solid rgba(255,217,61,.3);
  color:var(--gold);border-radius:20px;padding:5px 13px;
  font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;
}
.shop-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;}
.shop-item{
  display:flex;align-items:center;gap:11px;
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:13px;padding:11px 12px;margin-bottom:9px;
}
.shop-icon{
  flex:0 0 38px;height:38px;border-radius:10px;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.shop-body{flex:1;min-width:0;}
.shop-name{font-size:14px;font-weight:700;}
.shop-desc{font-size:11px;color:var(--dim);margin-top:2px;}
.pips{display:flex;gap:3px;margin-top:6px;}
.pip{width:12px;height:4px;border-radius:2px;background:#2b3746;}
.pip.on{background:var(--mint);}
.buy-btn{
  flex:0 0 auto;padding:9px 12px;border-radius:10px;
  border:1px solid rgba(255,217,61,.35);background:rgba(255,217,61,.1);
  color:var(--gold);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;
  min-width:66px;
}
.buy-btn:active{filter:brightness(1.4);}
.buy-btn:disabled{opacity:.35;}
.buy-btn.max{border-color:var(--line);background:transparent;color:var(--dim);}

/* ---------- 死亡 / 结算 ---------- */
.dead-title{color:var(--red);letter-spacing:4px;}
.revive-timer{height:5px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;margin-bottom:16px;}
.revive-fill{height:100%;width:100%;background:var(--red);}
.gold-earned{text-align:center;font-size:14px;color:var(--dim);margin:4px 0 14px;}
.gold-num{color:var(--gold);font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;}
.pause-stats{
  background:rgba(0,0,0,.25);border:1px solid var(--line);
  border-radius:12px;padding:12px;margin-bottom:14px;
  font-size:12px;line-height:1.9;color:var(--dim);
}
.pause-stats b{color:var(--txt);float:right;font-variant-numeric:tabular-nums;}

/* ---------- 设置 ---------- */
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px;
}
.toggle{
  width:50px;height:29px;border-radius:15px;border:none;
  background:#2b3746;position:relative;cursor:pointer;transition:background .18s;
}
.toggle::after{
  content:"";position:absolute;top:3px;left:3px;
  width:23px;height:23px;border-radius:50%;background:#7c8b9e;
  transition:transform .18s,background .18s;
}
.toggle.on{background:rgba(78,225,160,.28);}
.toggle.on::after{transform:translateX(21px);background:var(--mint);}

/* ---------- 模拟广告 ---------- */
.ad-overlay{background:rgba(0,0,0,.94);z-index:40;}
.ad-box{text-align:center;}
.ad-label{
  font-size:11px;color:var(--dim);letter-spacing:3px;
  border:1px dashed #3a4658;border-radius:8px;padding:7px 14px;display:inline-block;
}
.ad-spinner{
  width:52px;height:52px;margin:26px auto;
  border:3px solid #253040;border-top-color:var(--mint);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.ad-count{font-size:14px;color:var(--txt);font-variant-numeric:tabular-nums;}
#adCount{color:var(--gold);font-weight:800;font-size:18px;}

/* 大屏幕（平板/桌面）限制面板宽度即可，玩法不变 */
@media (min-width:900px){
  .panel{max-width:460px;}
}

</style>

<div id="app">
  <canvas id="game"></canvas>

  <!-- ============ 局内 HUD ============ -->
  <div id="hud" class="screen hidden">
    <div class="hud-top">
      <div class="hud-row">
        <div class="hp-wrap">
          <div class="hp-bar"><div id="hpFill" class="hp-fill"></div></div>
          <span id="hpText" class="hp-text">100/100</span>
        </div>
        <button id="btnPause" class="icon-btn" aria-label="暂停">❚❚</button>
      </div>
      <div class="xp-bar"><div id="xpFill" class="xp-fill"></div></div>
      <div class="hud-row hud-meta">
        <span id="lvlText" class="chip">Lv.1</span>
        <span id="timeText" class="chip time">05:00</span>
        <span id="killText" class="chip">☠ 0</span>
      </div>
    </div>
    <div id="weaponBar" class="weapon-bar"></div>
    <div id="toastLayer" class="toast-layer"></div>
  </div>

  <!-- ============ 主菜单 ============ -->
  <div id="menu" class="screen overlay">
    <div class="panel">
      <div class="logo">
        <div class="logo-main">枪火幸存者</div>
        <div class="logo-sub">ZOUL&nbsp;SURVIVORS</div>
      </div>
      <div class="best-row">
        <div class="stat"><span class="stat-v" id="bestTime">--:--</span><span class="stat-k">最佳存活</span></div>
        <div class="stat"><span class="stat-v" id="bestKill">0</span><span class="stat-k">最高击杀</span></div>
        <div class="stat"><span class="stat-v" id="goldText">0</span><span class="stat-k">金币</span></div>
      </div>
      <button id="btnStart" class="btn btn-primary">开 始 游 戏</button>
      <div class="btn-row">
        <button id="btnShop" class="btn">强化</button>
        <button id="btnSettings" class="btn">设置</button>

  <!-- ============ 强化商店（元进度） ============ -->
  <div id="shop" class="screen overlay hidden">
    <div class="panel panel-tall">
      <div class="panel-head">
        <h2>永久强化</h2>
        <div class="gold-pill">◆ <span id="shopGold">0</span></div>
      </div>
      <div id="shopList" class="shop-list"></div>
      <button id="btnShopBack" class="btn">返回</button>

  </div>

  <!-- ============ 三选一升级 ============ -->
  <div id="levelup" class="screen overlay hidden">

      <div id="cards" class="cards"></div>

  <!-- ============ 暂停 ============ -->
  <div id="paused" class="screen overlay hidden">
    <div class="panel">
      <h2>暂停</h2>

  <!-- ============ 死亡 / 复活 ============ -->
  <div id="dead" class="screen overlay hidden">

  <!-- ============ 结算 ============ -->
  <div id="result" class="screen overlay hidden">

        <div class="stat"><span class="stat-v" id="rKill">0</span><span class="stat-k">击杀</span></div>
        <div class="stat"><span class="stat-v" id="rLevel">1</span><span class="stat-k">等级</span></div>
      </div>
      <div class="gold-earned">获得 <span id="rGold" class="gold-num">0</span> 金币</div>
      <button id="btnDouble" class="btn btn-ad btn-big">
        <span class="ad-tag">AD</span> 看广告金币翻倍

      <button id="btnHome" class="btn">回主菜单</button>

  <!-- ============ 设置 ============ -->

      <button id="btnResetSave" class="btn btn-danger btn-sm">清除全部存档</button>
      <button id="btnSetBack" class="btn">返回</button>
    </div>

  <!-- ============ 模拟广告播放 ============ -->
  <div id="adOverlay" class="screen overlay hidden ad-overlay">
    <div class="ad-box">
      <div class="ad-label">广告位（测试模拟）</div>
      <div class="ad-spinner"></div>
      <div class="ad-count"><span id="adCount">3</span> 秒后可领取奖励</div>
    </div>
  </div>
</div>

<script>
/* 视口与主题色：内嵌页面拿不到我们自己的 <head>，运行时补上。
   没有这段的话手机上会按 980px 桌面宽度渲染，整个游戏缩成邮票大小。 */
(function () {
  function meta(name, content) {
    if (document.querySelector('meta[name="' + name + '"]')) return;
    var m = document.createElement('meta');
    m.setAttribute('name', name);
    m.setAttribute('content', content);
    document.head.appendChild(m);
  }
  meta('viewport', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
  meta('theme-color', '#0a0e14');
  meta('apple-mobile-web-app-capable', 'yes');
  meta('mobile-web-app-capable', 'yes');
})();
</script>
<script>
/* ===== js/save.js ===== */
/* ===== 存档：localStorage 元进度 ===== */
(function (global) {
  'use strict';

  var KEY = 'zoul_survivors_save_v1';

  var DEFAULTS = {
    gold: 0,
    bestTime: 0,
    bestKill: 0,
    runs: 0,
    wins: 0,
    meta: {},           // 永久强化等级 { id: level }
    lastDaily: '',      // 每日首局翻倍的领取日期
    noAds: false,       // 内购去广告
    settings: { sfx: true, dmgNum: true, haptic: true, shake: true }
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var data = clone(DEFAULTS);

  function load() {
    try {
      var raw = global.localStorage.getItem(KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      data = Object.assign(clone(DEFAULTS), parsed);
      data.settings = Object.assign(clone(DEFAULTS.settings), parsed.settings || {});
      data.meta = parsed.meta || {};
    } catch (e) {
      // 存档损坏时退回默认值，不阻塞游戏
      data = clone(DEFAULTS);
    }
  }

  function save() {
    try {
      global.localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) { /* 隐私模式下写入会失败，忽略 */ }
  }

  load();

  global.Save = {
    get data() { return data; },
    save: save,

    addGold: function (n) { data.gold += n; save(); },
    spendGold: function (n) {
      if (data.gold < n) return false;
      data.gold -= n; save(); return true;
    },

    metaLevel: function (id) { return data.meta[id] || 0; },
    setMetaLevel: function (id, lv) { data.meta[id] = lv; save(); },

    recordRun: function (time, kills, won) {
      data.runs++;
      if (won) data.wins++;
      if (time > data.bestTime) data.bestTime = time;
      if (kills > data.bestKill) data.bestKill = kills;
      save();
    },

    setting: function (k) { return data.settings[k]; },
    toggleSetting: function (k) {
      data.settings[k] = !data.settings[k];
      save();
      return data.settings[k];
    },

    reset: function () { data = clone(DEFAULTS); save(); }
  };
})(window);

/* ===== js/audio.js ===== */
/* ===== 音效：WebAudio 实时合成，零音频资源 =====
 * 手感规格要求"命中音按材质分层、开火音与命中音频段错开"。
 * 这里用合成器实现：包体 0KB，离线可用，音高可随机化避免重复听感疲劳。
 */

  /* ---------------- 异常（高风险高收益） ----------------
   * 策划案里的 Anomaly：必须带明确代价，且代价要一眼看懂。
   * 这些卡是构筑记忆点的来源 —— 玩家复述"我这局是 XX 流"时讲的就是它们。
   */
  var ANOMALIES = [
    { id: 'glass',   name: '玻璃火炮', icon: '☠', max: 1, tag: 'anomaly',
      desc: '伤害 +80%，生命上限 -40%',

    { id: 'berserk', name: '狂暴协议', icon: '🩸', max: 1, tag: 'anomaly',

  /* ---------------- 永久强化（局外元进度） ----------------
   * 目标：让每一局失败都留下可见的进度，"下一局会更强"。
   * 上限刻意做得不高 —— 元进度是安慰剂，不能变成"练级碾压"，
   * 否则技术和构筑就不重要了，游戏立刻变无聊。
   */
  var META_UPGRADES = [
    { id: 'm_dmg',    name: '弹药研发', icon: '🔺', max: 10, base: 120, desc: '初始伤害 +5% / 级' },
    { id: 'm_hp',     name: '装甲板',   icon: '❤', max: 10, base: 100, desc: '初始生命 +12 / 级' },
    { id: 'm_speed',  name: '伺服马达', icon: '👟', max: 8,  base: 150, desc: '移动速度 +2.5% / 级' },
    { id: 'm_rate',   name: '枪机打磨', icon: '⏩', max: 8,  base: 160, desc: '初始射速 +3% / 级' },
    { id: 'm_pickup', name: '磁场发生器', icon: '🧲', max: 6, base: 130, desc: '拾取范围 +12% / 级' },

  function metaCost(u, lv) {
    return Math.floor(u.base * Math.pow(1.55, lv));
  }

  /* ---------------- 抽卡 ---------------- */

  function ownedWeaponCount(p) {
    return Object.keys(p.weapons).length;
  }

  /** 收集所有当前可选项，标注类型与当前等级 */
  function buildPool(p) {
    var pool = [];

    // 副武器：已有的可升级；未满 4 把时可解锁新武器
    Object.keys(WEAPON_DATA).forEach(function (wid) {
      var w = WEAPON_DATA[wid];
      var cur = p.weapons[wid] || 0;
      if (cur > 0 && cur < w.maxLv) {
        pool.push({ kind: 'weapon', id: wid, lv: cur + 1, isNew: false, weight: 26, tag: 'weapon' });
      } else if (cur === 0 && ownedWeaponCount(p) < 4) {
        pool.push({ kind: 'weapon', id: wid, lv: 1, isNew: true, weight: 16, tag: 'weapon' });
      }
    });

    // 属性
    STAT_UPGRADES.forEach(function (u) {
      var cur = p.upgrades[u.id] || 0;
      if (cur < u.max) {
        pool.push({ kind: 'stat', id: u.id, lv: cur + 1, isNew: cur === 0, weight: 20, tag: u.tag });
      }
    });

    // 异常：5 级以后才出现，且概率低 —— 它是惊喜，不是常态
    if (p.level >= 5) {
      ANOMALIES.forEach(function (u) {
        var cur = p.upgrades[u.id] || 0;
        if (cur < u.max) {
          pool.push({ kind: 'anomaly', id: u.id, lv: 1, isNew: true, weight: 7, tag: 'anomaly' });
        }
      });
    }

    return pool;
  }

  function pickWeighted(list) {
    var total = 0, i;
    for (i = 0; i < list.length; i++) total += list[i].weight;
    var r = Math.random() * total;
    for (i = 0; i < list.length; i++) {
      r -= list[i].weight;
      if (r <= 0) return list[i];
    }
    return list[list.length - 1];
  }

  /**
   * 抽 3 张卡。
   * 契约（来自策划案）：
   *   1) 至少 1 张与玩家当前主线构筑强相关 —— 保证能成型
   *   2) 至少 1 张与当前构筑无关 —— 保证有意外
   *   3) 生命危险时（<35%）强插一张生存卡 —— 这不是作弊，是不让玩家被随机数杀死
   */
  function roll(p) {
    var pool = buildPool(p);
    if (pool.length === 0) return [];

    var picked = [];
    var used = {};

    function take(list) {
      var candidates = list.filter(function (c) { return !used[c.kind + c.id]; });
      if (candidates.length === 0) return null;
      var c = pickWeighted(candidates);
      used[c.kind + c.id] = true;
      picked.push(c);
      return c;
    }

    // 规则 3：濒死救济
    if (p.hp / p.maxHp < 0.35) {
      var survivors = pool.filter(function (c) { return c.tag === 'surv'; });
      if (survivors.length) take(survivors);
    }

    // 规则 1：强相关（玩家已投资过的方向）
    if (picked.length < 3) {
      var owned = pool.filter(function (c) {
        if (c.kind === 'weapon') return !c.isNew;
        return (p.upgrades[c.id] || 0) > 0;
      });
      if (owned.length) take(owned);
    }

    // 规则 2：一张全新的
    if (picked.length < 3) {
      var fresh = pool.filter(function (c) { return c.isNew; });
      if (fresh.length) take(fresh);
    }

    // 剩下的随便填
    while (picked.length < 3) {
      if (!take(pool)) break;
    }

    return picked;
  }

  /** 把抽到的卡渲染成 UI 需要的数据 */
  function describe(card) {
    if (card.kind === 'weapon') {
      var w = WEAPON_DATA[card.id];
      return {
        name: w.name, icon: w.icon, lv: card.lv,
        desc: w.desc(card.lv),
        cls: 'weapon', isNew: card.isNew
      };
    }
    var list = card.kind === 'anomaly' ? ANOMALIES : STAT_UPGRADES;
    var u = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === card.id) { u = list[i]; break; }
    return {
      name: u.name, icon: u.icon, lv: card.lv,
      desc: u.desc, max: u.max,
      cls: card.kind === 'anomaly' ? 'new' : '', isNew: card.isNew
    };
  }

  /** 应用一张卡到玩家身上 */
  function apply(p, card) {
    if (card.kind === 'weapon') {
      p.weapons[card.id] = card.lv;
      p.weaponCd[card.id] = 0;
      return;
    }
    var list = card.kind === 'anomaly' ? ANOMALIES : STAT_UPGRADES;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === card.id) {
        list[i].apply(p);
        p.upgrades[card.id] = (p.upgrades[card.id] || 0) + 1;
        return;
      }
    }
  }

  global.Upgrades = {
    WEAPON_DATA: WEAPON_DATA,
    STAT_UPGRADES: STAT_UPGRADES,
    ANOMALIES: ANOMALIES,
    META_UPGRADES: META_UPGRADES,
    metaCost: metaCost,
    roll: roll,
    describe: describe,
    apply: apply
  };
})(window);

/* ===== 实体、对象池、空间网格、敌人数值表 ===== */
(function (global) {
  'use strict';

  /* ---------------- 对象池 ----------------
   * 手机上 GC 卡顿是掉帧的头号来源。所有高频实体全部复用，
   * 战斗中不允许 new 对象。
   */
  function Pool(factory, reset) {
    this.items = [];      // 活跃对象（紧凑数组，用交换删除）
    this.free = [];       // 空闲对象
    this.factory = factory;
    this.resetFn = reset;
  }
  Pool.prototype.spawn = function () {
    var o = this.free.length ? this.free.pop() : this.factory();
    this.resetFn.apply(null, [o].concat(Array.prototype.slice.call(arguments)));
    o.alive = true;
    this.items.push(o);
    return o;
  };
  Pool.prototype.sweep = function () {
    var items = this.items;
    for (var i = items.length - 1; i >= 0; i--) {
      if (!items[i].alive) {
        this.free.push(items[i]);
        items[i] = items[items.length - 1];
        items.pop();
      }
    }
  };
  Pool.prototype.clear = function () {
    for (var i = 0; i < this.items.length; i++) this.free.push(this.items[i]);
    this.items.length = 0;
  };

  /* ---------------- 空间网格 ----------------
   * 子弹碰撞 + 敌人互相分离都靠它。
   * 没有它，160 个敌人两两分离就是 25600 次距离计算/帧，手机直接跪。
   */
  function SpatialGrid(cell) {
    this.cell = cell;
    this.map = new Map();
  }
  SpatialGrid.prototype.key = function (cx, cy) { return cx * 73856093 ^ cy * 19349663; };
  SpatialGrid.prototype.clear = function () { this.map.clear(); };
  SpatialGrid.prototype.insert = function (o) {
    var cx = Math.floor(o.x / this.cell), cy = Math.floor(o.y / this.cell);
    var k = this.key(cx, cy);
    var arr = this.map.get(k);
    if (!arr) { arr = []; this.map.set(k, arr); }
    arr.push(o);
  };
  /** 收集 (x,y) 周围 radius 内可能相交的对象到 out 数组 */
  SpatialGrid.prototype.query = function (x, y, radius, out) {
    out.length = 0;
    var c = this.cell;
    var x0 = Math.floor((x - radius) / c), x1 = Math.floor((x + radius) / c);
    var y0 = Math.floor((y - radius) / c), y1 = Math.floor((y + radius) / c);
    for (var cx = x0; cx <= x1; cx++) {
      for (var cy = y0; cy <= y1; cy++) {
        var arr = this.map.get(this.key(cx, cy));
        if (!arr) continue;
        for (var i = 0; i < arr.length; i++) out.push(arr[i]);
      }
    }
    return out;
  };

  /* ---------------- 敌人数值表 ----------------
   * 设计原则（沿用策划案）：每种敌人只教玩家一件事。
   * 提难度靠"组合与节奏"，血量随时间的成长上限受控。
   */
  var ENEMY_TYPES = {
    grunt: {
      name: '冲锋兵', teaches: '不能站桩',

    shooter: {

    },
    brute: {

    },
    bomber: {
      name: '自爆虫', teaches: '要管理空间',

    splitter: {

    },
    spawn: { // 分裂产物
      name: '碎片', teaches: '',

    },

  /* ---------------- 池的构造与重置 ---------------- */

  var Pools = {
    bullets: new Pool(

    ),

        e.kx = 0; e.ky = 0;          // 击退速度
        e.fireCd = t.fireCd ? t.fireCd * (0.6 + Math.random() * 0.8) : 0;
        e.hitCd = 0;                  // 接触伤害冷却
        e.orbitCd = 0;                // 无人机对该敌人的伤害冷却（池复用必须清零）
        e.phase = 0;
        e.wobble = Math.random() * 6.28;
        e.burstLeft = 0;
      }
    ),

    pickups: new Pool(
      function () { return {}; },
      function (p, x, y, kind, value) {
        p.x = x; p.y = y;
        p.vx = (Math.random() - 0.5) * 90;
        p.vy = (Math.random() - 0.5) * 90;
        p.kind = kind;     // 'xp' | 'gold' | 'heal' | 'magnet' | 'nuke'
        p.value = value;
        p.r = kind === 'xp' ? 5 : 8;
        p.life = 30;
        p.pulled = false;
      }
    ),

    particles: new Pool(
      function () { return {}; },
      function (p, x, y, vx, vy, life, color, size, kind) {

        p.color = color; p.size = size;
        p.kind = kind || 'dot';
      }
    ),

    damageNumbers: new Pool(
      function () { return {}; },
      function (d, x, y, text, crit) {
        d.x = x; d.y = y;
        d.vy = -46 - Math.random() * 18;

    mines: new Pool(
      function () { return {}; },
      function (m, x, y, dmg, radius, life) {

      function () { return {}; },
      function (g, x, y, tx, ty, dmg, radius) {

      }

    // 纯表现层：爆炸圈、激光柱、电弧线
    fx: new Pool(
      function () { return { pts: [] }; },
      function (f, kind, x, y, r, life, color, pts) {
        f.kind = kind; f.x = x; f.y = y; f.r = r;
        f.life = life; f.maxLife = life; f.color = color;
        f.pts.length = 0;
        if (pts) for (var i = 0; i < pts.length; i++) f.pts.push(pts[i]);
      }
    )
  };

  global.Ent = {
    Pool: Pool,
    SpatialGrid: SpatialGrid,
    ENEMY_TYPES: ENEMY_TYPES,
    Pools: Pools,
    clearAll: function () {
      Object.keys(Pools).forEach(function (k) { Pools[k].clear(); });
    }
  };
})(window);
