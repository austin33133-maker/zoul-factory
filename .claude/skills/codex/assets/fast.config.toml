# Profile: fast — layered over config.toml via `codex exec -p fast`
# For high-volume, low-complexity work where latency and quota matter more than depth.
# `low` here is a deliberate speed choice, not a model limit: luna supports up to
# "max" (it lacks only "ultra"). Raise it if these runs come back too shallow.
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
model_verbosity = "low"
web_search = "cached"
