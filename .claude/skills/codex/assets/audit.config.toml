# Profile: audit — layered over config.toml via `codex exec -p audit`
# Max reasoning, zero write authority. Use for code review, security review, and
# "give me a second opinion" runs where Codex must not touch the working tree.
model = "gpt-5.6-sol"
# "max" rather than "ultra": deepest single-agent reasoning, without ultra's
# automatic task delegation — a review should be one coherent pass.
model_reasoning_effort = "max"
model_verbosity = "high"
sandbox_mode = "read-only"
approval_policy = "never"
web_search = "live"
