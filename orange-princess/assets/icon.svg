  <circle cx="296" cy="266" r="18" fill="#fff" stroke="#5a2810" stroke-width="3"/>
  <circle cx="218" cy="270" r="9" fill="#1a0e2e"/>
  <circle cx="298" cy="270" r="9" fill="#1a0e2e"/>
  <circle cx="214" cy="266" r="3" fill="#fff"/>
  <circle cx="294" cy="266" r="3" fill="#fff"/>
  <!-- 嘴 -->
  <path d="M 226 320 Q 256 350 286 320" stroke="#5a2810" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="190" cy="304" rx="14" ry="9" fill="#ff5e3a" opacity="0.45"/>
